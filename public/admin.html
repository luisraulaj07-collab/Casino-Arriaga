<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Panel del dealer — Casino por pinche gusto</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css">
<style>
  .top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 8px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .staff-badge {
    display: inline-block;
    font-size: 11px;
    padding: 3px 8px;
    border-radius: 999px;
    background: rgba(255,255,255,0.08);
    color: var(--gold);
  }
  .btn-logout {
    padding: 5px 10px;
    font-size: 11px;
    background: rgba(240,128,128,0.14);
    border: 1px solid rgba(240,128,128,0.4);
    color: #f49b9b;
    border-radius: 6px;
    cursor: pointer;
  }
  .btn-logout:hover {
    background: rgba(240,128,128,0.24);
  }
  .section-title {
    font-size: 12px;
    font-weight: 700;
    color: var(--gold);
    margin-bottom: 8px;
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  .user-row, .mov-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 8px 0;
    border-top: 1px solid rgba(255,255,255,0.08);
    font-size: 12px;
    gap: 8px;
  }
  .user-meta {
    color: var(--gold-dim);
    font-size: 11px;
  }
  .mov-list {
    max-height: 240px;
    overflow-y: auto;
  }
  .pos {
    color: #7fd88f;
    font-weight: 700;
    white-space: nowrap;
  }
  .neg {
    color: #f08080;
    font-weight: 700;
    white-space: nowrap;
  }
</style>
</head>
<body>
<div class="table black" style="max-width:680px">
  <div class="brand">CASINO POR PINCHE GUSTO</div>
  <div class="brand-sub">PANEL DEL DEALER Y COLABORADORES</div>

  <div class="panel">
    <div class="top-bar">
      <div class="staff-badge" id="staffRole">Acceso: Pendiente</div>
      <button type="button" class="btn-logout" id="logoutBtn" style="display:none">Cerrar sesión</button>
    </div>
    <div class="row" style="flex-wrap:wrap">
      <input type="text" id="staffName" placeholder="Tu nombre o alias (ej. Colaborador 1)">
      <input type="password" id="secret" placeholder="Clave de acceso (ADMIN_SECRET o clave staff)">
      <button id="loadBtn">Ver panel</button>
    </div>
    <div class="error" id="err"></div>
  </div>

  <!-- Bloque exclusivo del Admin para dar saldo operativo a colaboradores -->
  <div class="panel" id="staffFundPanel" style="display:none">
    <div class="section-title">Saldo operativo de colaboradores</div>
    <div id="walletsSummary" style="margin-bottom:10px"></div>
    <div class="row" style="flex-wrap:wrap">
      <select id="staffTargetSelect">
        <option value="staff_1">Colaborador 1</option>
        <option value="staff_2">Colaborador 2</option>
      </select>
      <input type="number" id="staffFundAmount" min="1" placeholder="Monto a dar al colaborador">
      <button id="staffFundBtn">Dar saldo</button>
    </div>
    <div class="msg" id="staffFundMsg"></div>
  </div>

  <!-- Recargar o descontar saldo a jugadores -->
  <div class="panel" id="rechargePanel" style="display:none">
    <div class="section-title">Operación con jugador</div>
    <div class="row" style="margin-bottom:8px">
      <input type="text" id="userSearch" placeholder="Buscar jugador por nombre, @usuario o ID...">
    </div>
    <div class="row" style="flex-wrap:wrap">
      <select id="userSelect"></select>
      <select id="actionType">
        <option value="recharge">Recargar (+)</option>
        <option value="payout">Pagar / descontar (-)</option>
      </select>
      <input type="number" id="amount" min="1" placeholder="Monto">
      <button id="rechargeBtn">Aplicar</button>
    </div>
    <div class="msg" id="rechargeMsg"></div>
  </div>

  <!-- Lista de jugadores -->
  <div class="panel" id="usersPanel" style="display:none">
    <div class="section-title">Jugadores</div>
    <div id="usersList"></div>
  </div>

  <!-- Historial de movimientos -->
  <div class="panel" id="movementsPanel" style="display:none">
    <div class="section-title">Historial de movimientos</div>
    <div id="movementsList" class="mov-list"></div>
  </div>

  <a class="lobby-link" href="index.html">← Volver a la mesa principal</a>
</div>

<script>
  var allUsers = [];

  var el = {
    staffRole: document.getElementById('staffRole'),
    logoutBtn: document.getElementById('logoutBtn'),
    staffName: document.getElementById('staffName'),
    secret: document.getElementById('secret'),
    loadBtn: document.getElementById('loadBtn'),
    err: document.getElementById('err'),
    staffFundPanel: document.getElementById('staffFundPanel'),
    walletsSummary: document.getElementById('walletsSummary'),
    staffTargetSelect: document.getElementById('staffTargetSelect'),
    staffFundAmount: document.getElementById('staffFundAmount'),
    staffFundBtn: document.getElementById('staffFundBtn'),
    staffFundMsg: document.getElementById('staffFundMsg'),
    userSearch: document.getElementById('userSearch'),
    usersPanel: document.getElementById('usersPanel'),
    usersList: document.getElementById('usersList'),
    rechargePanel: document.getElementById('rechargePanel'),
    userSelect: document.getElementById('userSelect'),
    actionType: document.getElementById('actionType'),
    amount: document.getElementById('amount'),
    rechargeBtn: document.getElementById('rechargeBtn'),
    rechargeMsg: document.getElementById('rechargeMsg'),
    movementsPanel: document.getElementById('movementsPanel'),
    movementsList: document.getElementById('movementsList')
  };

  el.secret.value = sessionStorage.getItem('cpg_staff_secret') || '';
  el.staffName.value = sessionStorage.getItem('cpg_staff_name') || '';

  function formatLabel(u) {
    var base = u.first_name || u.username || u.telegram_id;
    return u.username ? (base + ' (@' + u.username + ')') : String(base);
  }

  function matchesSearch(u, term) {
    if (!term) return true;
    var q = term.toLowerCase();
    var name = String(u.first_name || '').toLowerCase();
    var username = String(u.username || '').toLowerCase();
    var idStr = String(u.telegram_id || '').toLowerCase();
    return name.indexOf(q) !== -1 || username.indexOf(q) !== -1 || idStr.indexOf(q) !== -1;
  }

  function renderFilteredUsers() {
    var term = (el.userSearch.value || '').trim();
    var prevSelected = el.userSelect.value;
    var filtered = allUsers.filter(function(u) { return matchesSearch(u, term); });

    el.usersList.innerHTML = '';
    el.userSelect.innerHTML = '';

    if (!filtered.length) {
      el.usersList.innerHTML = '<div class="user-meta">No se encontraron jugadores con ese filtro.</div>';
      var emptyOpt = document.createElement('option');
      emptyOpt.value = '';
      emptyOpt.textContent = 'Sin coincidencias';
      el.userSelect.appendChild(emptyOpt);
      return;
    }

    var stillExists = false;
    filtered.forEach(function(u) {
      if (String(u.telegram_id) === String(prevSelected)) stillExists = true;

      var row = document.createElement('div');
      row.className = 'user-row';

      var left = document.createElement('div');
      var title = document.createElement('b');
      title.style.color = 'var(--gold)';
      title.textContent = formatLabel(u);
      var sub = document.createElement('div');
      sub.className = 'user-meta';
      sub.textContent = 'ID: ' + u.telegram_id;
      left.appendChild(title);
      left.appendChild(sub);

      var right = document.createElement('b');
      right.textContent = '$' + Number(u.balance || 0);

      row.appendChild(left);
      row.appendChild(right);
      el.usersList.appendChild(row);

      var opt = document.createElement('option');
      opt.value = u.telegram_id;
      opt.textContent = formatLabel(u) + ' — $' + Number(u.balance || 0);
      el.userSelect.appendChild(opt);
    });

    if (stillExists) {
      el.userSelect.value = prevSelected;
    } else if (filtered.length === 1) {
      el.userSelect.value = filtered[0].telegram_id;
    }
  }

  function renderWallets(wallets) {
    if (!wallets) return;
    var s1 = (wallets.staff_1 && wallets.staff_1.balance) || 0;
    var s2 = (wallets.staff_2 && wallets.staff_2.balance) || 0;
    el.walletsSummary.innerHTML =
      '<div class="user-row"><span><b>Colaborador 1</b> (saldo operativo)</span><b>$' + Number(s1) + '</b></div>' +
      '<div class="user-row"><span><b>Colaborador 2</b> (saldo operativo)</span><b>$' + Number(s2) + '</b></div>';
  }

  function renderMovements(movements) {
    el.movementsList.innerHTML = '';
    if (!movements || !movements.length) {
      el.movementsList.innerHTML = '<div class="user-meta">Sin movimientos registrados aún.</div>';
      el.movementsPanel.style.display = '';
      return;
    }

    movements.forEach(function(m) {
      var row = document.createElement('div');
      row.className = 'mov-row';

      var left = document.createElement('div');
      var title = document.createElement('b');
      title.style.color = 'var(--gold)';
      title.textContent = (m.staff_name || m.staff_key) + ' — ' + (m.detail || m.action_type);

      var sub = document.createElement('div');
      sub.className = 'user-meta';
      var metaParts = [];
      if (m.created_at) metaParts.push(m.created_at);
      if (m.target_user_id) metaParts.push('Jugador ID: ' + m.target_user_id);
      if (m.balance_after !== null && m.balance_after !== undefined) {
        metaParts.push('Saldo op.: $' + Number(m.balance_after));
      }
      sub.textContent = metaParts.join(' · ');

      left.appendChild(title);
      left.appendChild(sub);

      var amt = Number(m.amount || 0);
      var right = document.createElement('div');
      right.className = amt >= 0 ? 'pos' : 'neg';
      right.textContent = (amt >= 0 ? '+$' : '-$') + Math.abs(amt);

      row.appendChild(left);
      row.appendChild(right);
      el.movementsList.appendChild(row);
    });

    el.movementsPanel.style.display = '';
  }

  function logoutPanel() {
    sessionStorage.removeItem('cpg_staff_secret');
    sessionStorage.removeItem('cpg_staff_name');
    allUsers = [];
    el.secret.value = '';
    el.staffName.value = '';
    el.userSearch.value = '';
    el.amount.value = '';
    el.staffFundAmount.value = '';
    el.err.textContent = '';
    el.rechargeMsg.textContent = '';
    el.staffFundMsg.textContent = '';
    el.staffRole.textContent = 'Acceso: Pendiente';
    el.logoutBtn.style.display = 'none';
    el.staffFundPanel.style.display = 'none';
    el.rechargePanel.style.display = 'none';
    el.usersPanel.style.display = 'none';
    el.movementsPanel.style.display = 'none';
  }

  function loadPanel() {
    el.err.textContent = '';
    var secretVal = el.secret.value.trim();
    var staffVal = el.staffName.value.trim();
    if (!secretVal) {
      el.err.textContent = 'Ingresa la clave de acceso.';
      return;
    }
    sessionStorage.setItem('cpg_staff_secret', secretVal);
    sessionStorage.setItem('cpg_staff_name', staffVal);

    fetch('/api/admin/users', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ adminSecret: secretVal, staffName: staffVal })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.error) {
        el.err.textContent = data.error;
        return;
      }

      el.logoutBtn.style.display = '';
      allUsers = Array.isArray(data) ? data : (data.users || []);
      var roleLabel = (!Array.isArray(data) && data.role) ? data.role : 'Dealer / Admin';
      var isAdmin = (!Array.isArray(data) && data.isAdmin !== undefined)
        ? Boolean(data.isAdmin)
        : (roleLabel.toLowerCase().indexOf('admin') !== -1 || roleLabel.toLowerCase().indexOf('dealer') !== -1);

      var roleText = 'Acceso: ' + roleLabel + (staffVal ? ' — ' + staffVal : '');
      if (!isAdmin && data.staffBalance !== null && data.staffBalance !== undefined) {
        roleText += ' · Tu saldo operativo: $' + Number(data.staffBalance);
      }
      el.staffRole.textContent = roleText;

      if (isAdmin) {
        el.staffFundPanel.style.display = '';
        renderWallets(data.wallets);
      } else {
        el.staffFundPanel.style.display = 'none';
      }

      el.usersPanel.style.display = allUsers.length ? '' : 'none';
      el.rechargePanel.style.display = allUsers.length ? '' : 'none';
      renderFilteredUsers();
      renderMovements(data.movements || []);
    })
    .catch(function() {
      el.err.textContent = 'Error de conexión al cargar el panel.';
    });
  }

  el.loadBtn.addEventListener('click', loadPanel);
  el.logoutBtn.addEventListener('click', logoutPanel);
  el.userSearch.addEventListener('input', renderFilteredUsers);

  el.staffFundBtn.addEventListener('click', function() {
    el.staffFundMsg.textContent = '';
    var targetStaff = el.staffTargetSelect.value;
    var fundAmt = parseInt(el.staffFundAmount.value, 10);
    if (!fundAmt || fundAmt <= 0) {
      el.staffFundMsg.textContent = 'Escribe un monto mayor a 0.';
      return;
    }

    fetch('/api/admin/staff-fund', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        adminSecret: el.secret.value.trim(),
        staffKey: targetStaff,
        amount: fundAmt
      })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.error) {
        el.staffFundMsg.textContent = data.error;
        return;
      }
      el.staffFundMsg.textContent = 'Saldo operativo actualizado para colaborador: $' + data.balance;
      el.staffFundAmount.value = '';
      loadPanel();
    })
    .catch(function() {
      el.staffFundMsg.textContent = 'Error al dar saldo al colaborador.';
    });
  });

  el.rechargeBtn.addEventListener('click', function() {
    el.rechargeMsg.textContent = '';
    var telegramId = el.userSelect.value;
    if (!telegramId) {
      el.rechargeMsg.textContent = 'Selecciona un jugador válido.';
      return;
    }
    var rawAmount = parseInt(el.amount.value, 10);
    if (!rawAmount || rawAmount <= 0) {
      el.rechargeMsg.textContent = 'Escribe un monto mayor a 0.';
      return;
    }

    var isPayout = el.actionType.value === 'payout';
    var finalAmount = isPayout ? -Math.abs(rawAmount) : Math.abs(rawAmount);
    var staffVal = el.staffName.value.trim() || 'staff';

    fetch('/api/admin/recharge', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        adminSecret: el.secret.value.trim(),
        staffName: staffVal,
        actionType: el.actionType.value,
        telegramId: telegramId,
        amount: finalAmount
      })
    })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      if (data.error) {
        el.rechargeMsg.textContent = data.error;
        return;
      }
      el.rechargeMsg.textContent = 'Listo (' + (isPayout ? 'Pago/descuento' : 'Recarga') + ') — nuevo saldo: $' + data.balance;
      el.amount.value = '';
      loadPanel();
    })
    .catch(function() {
      el.rechargeMsg.textContent = 'Error al actualizar el saldo.';
    });
  });

  if (el.secret.value) {
    loadPanel();
  }
</script>
</body>
</html>
