<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Video Póker — Cartel Mexicano</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css">
<style>
  .vp-hand{display:flex;gap:6px;justify-content:center;margin:14px 0;}
  .vp-card{
    width:58px;height:82px;background:var(--cream);border-radius:6px;border:2px solid #cfc2a4;
    display:flex;flex-direction:column;justify-content:space-between;padding:5px 6px;
    font-weight:700;font-size:14px;color:var(--ink);box-shadow:0 3px 6px rgba(0,0,0,0.4);
    cursor:pointer;transition:transform 0.1s ease;
  }
  .vp-card.red{color:var(--red);}
  .vp-card.held{border-color:var(--gold);transform:translateY(-8px);box-shadow:0 6px 10px rgba(0,0,0,0.5);}
  .hold-label{text-align:center;font-size:10px;color:var(--gold-dim);margin-top:4px;height:12px;}
  .hold-label.on{color:var(--gold);font-weight:700;}
  .paytable{font-size:10px;color:var(--gold-dim);text-align:center;margin:10px 0 16px;line-height:1.6;}
  .paytable b{color:var(--gold);}
</style>
</head>
<body>
<div class="table felt">
  <div class="brand">CARTEL MEXICANO</div>
  <div class="brand-sub">VIDEO PÓKER · JACKS OR BETTER</div>

  <div class="hud">
    <div>Jugador<br><b id="name">—</b></div>
    <div style="text-align:right">Saldo<br><b id="balance">—</b></div>
  </div>

  <div class="paytable">
    Real x250 · Color de escalera x50 · Póker x25 · Full x6 · Color x5<br>
    Escalera x4 · Trío x3 · Doble par x2 · <b>Par de J o mejor</b> x1
  </div>

  <div class="vp-hand" id="handWrap"></div>
  <div class="msg" id="msg">Coloca tu apuesta y reparte.</div>
  <div class="error" id="err"></div>

  <div id="betPanel" class="panel">
    <div class="row">
      <input type="number" id="betInput" min="1" placeholder="Apuesta">
      <button id="dealBtn">Repartir</button>
    </div>
  </div>

  <div id="drawControls" class="controls" style="display:none">
    <button id="drawBtn" style="width:100%">Cambiar cartas seleccionadas</button>
  </div>

  <div id="nextControls" class="controls" style="display:none">
    <button id="nextBtn" style="width:100%">Siguiente mano</button>
  </div>

  <a class="lobby-link" href="index.html">← Volver a la mesa principal</a>
</div>

<script>
  var tg = window.Telegram.WebApp;
  tg.ready(); tg.expand();
  var initData = tg.initData;

  var currentHand = [];
  var holds = [false,false,false,false,false];
  var phase = 'bet'; // bet | draw

  var el = {
    name: document.getElementById('name'), balance: document.getElementById('balance'),
    handWrap: document.getElementById('handWrap'), msg: document.getElementById('msg'), err: document.getElementById('err'),
    betPanel: document.getElementById('betPanel'), betInput: document.getElementById('betInput'), dealBtn: document.getElementById('dealBtn'),
    drawControls: document.getElementById('drawControls'), drawBtn: document.getElementById('drawBtn'),
    nextControls: document.getElementById('nextControls'), nextBtn: document.getElementById('nextBtn')
  };

  function api(path, body){
    return fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(Object.assign({initData:initData}, body||{})) })
      .then(function(r){ return r.json(); });
  }
  function refreshMe(){
    return api('/api/me').then(function(d){
      if(d.error){ el.err.textContent = d.error; return; }
      el.name.textContent = d.name; el.balance.textContent = '$'+d.balance;
    });
  }
  function setMsg(t, cls){ el.msg.textContent = t; el.msg.className = 'msg' + (cls?(' '+cls):''); }

  var resultLabels = {
    royal_flush:'¡Escalera real!', straight_flush:'Escalera de color', four_kind:'Póker',
    full_house:'Full', flush:'Color', straight:'Escalera', three_kind:'Trío',
    two_pair:'Doble par', jacks_or_better:'Par de J o mejor', low_pair:'Par bajo (no paga)', nothing:'Nada — sin suerte'
  };

  function renderHand(hand, selectable){
    el.handWrap.innerHTML = '';
    hand.forEach(function(c, i){
      var wrap = document.createElement('div');
      var card = document.createElement('div');
      card.className = 'vp-card' + (c.red ? ' red' : (c.suit==='♥'||c.suit==='♦' ? ' red' : '')) + (holds[i] ? ' held' : '');
      card.innerHTML = '<div>'+c.rank+c.suit+'</div><div style="align-self:center;font-size:18px">'+c.suit+'</div><div style="align-self:flex-end;transform:rotate(180deg)">'+c.rank+c.suit+'</div>';
      if(selectable){
        card.addEventListener('click', function(){
          holds[i] = !holds[i];
          renderHand(hand, true);
        });
      }
      var label = document.createElement('div');
      label.className = 'hold-label' + (holds[i] ? ' on' : '');
      label.textContent = holds[i] ? 'GUARDAR' : '';
      wrap.appendChild(card); wrap.appendChild(label);
      el.handWrap.appendChild(wrap);
    });
  }

  el.dealBtn.addEventListener('click', function(){
    el.err.textContent = '';
    var bet = parseInt(el.betInput.value, 10);
    if(!bet || bet<=0){ el.err.textContent = 'Ingresa una apuesta válida.'; return; }
    api('/api/videopoker/deal', {bet:bet}).then(function(d){
      if(d.error){ el.err.textContent = d.error; return; }
      currentHand = d.hand;
      holds = [false,false,false,false,false];
      el.balance.textContent = '$'+d.balance;
      renderHand(currentHand, true);
      setMsg('Toca las cartas que quieras conservar, luego cambia el resto.');
      phase = 'draw';
      el.betPanel.style.display = 'none';
      el.drawControls.style.display = '';
      el.nextControls.style.display = 'none';
    });
  });

  el.drawBtn.addEventListener('click', function(){
    api('/api/videopoker/draw', {holds:holds}).then(function(d){
      if(d.error){ el.err.textContent = d.error; return; }
      currentHand = d.hand;
      renderHand(currentHand, false);
      el.balance.textContent = '$'+d.balance;
      var label = resultLabels[d.result] || d.result;
      var cls = d.mult > 0 ? 'win' : 'lose';
      setMsg(label + (d.mult>0 ? ' — Ganaste ($'+(d.delta)+')' : ' ($'+d.delta+')'), cls);
      el.drawControls.style.display = 'none';
      el.nextControls.style.display = '';
    });
  });

  el.nextBtn.addEventListener('click', function(){
    el.betInput.value = '';
    el.handWrap.innerHTML = '';
    setMsg('Coloca tu apuesta y reparte.');
    el.betPanel.style.display = '';
    el.nextControls.style.display = 'none';
    phase = 'bet';
  });

  refreshMe();
</script>
</body>
</html>
