<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Mesa Multijugador — Cartel Mexicano</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="/socket.io/socket.io.js"></script>
<link rel="stylesheet" href="style.css">
<style>
  .table-felt {
    background: radial-gradient(circle, #1b4d3e 0%, #0d281f 100%);
    border: 6px solid #b39b58;
    border-radius: 16px;
    padding: 16px;
    box-shadow: inset 0 0 20px rgba(0,0,0,0.7), 0 8px 20px rgba(0,0,0,0.5);
    margin: 10px auto;
    max-width: 480px;
    min-height: 480px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }
  .pot-display {
    text-align: center;
    background: rgba(0, 0, 0, 0.4);
    border: 1px solid #b39b58;
    border-radius: 8px;
    padding: 8px;
    margin: 10px 0;
    color: #f3e5ab;
    font-size: 15px;
    font-weight: bold;
  }
  .players-container {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin: 10px 0;
    max-height: 220px;
    overflow-y: auto;
  }
  .player-seat {
    background: rgba(255, 255, 255, 0.08);
    border: 1px solid rgba(179, 155, 88, 0.4);
    border-radius: 8px;
    padding: 8px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    color: #fff;
    font-size: 14px;
  }
  .player-seat.me {
    border-color: #b39b58;
    background: rgba(179, 155, 88, 0.15);
  }
  .table-actions {
    display: flex;
    gap: 8px;
    margin-top: 12px;
  }
</style>
</head>
<body>
<div class="table-felt">
  <div>
    <div class="brand" style="text-align:center;">CARTEL MEXICANO</div>
    <div class="brand-sub" style="text-align:center;">PÓKER EN VIVO — MESA MULTIJUGADOR</div>

    <div class="hud" style="margin-top:10px;">
      <div>Jugador<br><b id="myName">—</b></div>
      <div style="text-align:right">Fichas en Mesa<br><b id="myChips">1000</b></div>
    </div>

    <div class="pot-display">
      Pozo Acumulado: $<span id="potAmount">0</span>
    </div>

    <div style="font-size: 12px; color: #cfc2a4; text-align: center; margin-bottom: 4px;">Jugadores sentados en la mesa:</div>
    <div class="players-container" id="playersList">
      <!-- Los jugadores se pintarán aquí dinámicamente -->
    </div>
  </div>

  <div>
    <div class="error" id="err"></div>
    <div class="msg" id="msg">Conectando a la mesa multijugador...</div>

    <div class="table-actions" id="gameControls">
      <button id="readyBtn" style="width:100%; background-color:#b39b58; color:#0d281f; font-weight:bold;">Listos para iniciar mano</button>
    </div>

    <a class="lobby-link" href="index.html" style="display:block; text-align:center; margin-top:14px;">← Volver a la mesa principal</a>
  </div>
</div>

<script>
  var tg = window.Telegram.WebApp;
  tg.ready(); tg.expand();
  var initData = tg.initData;

  var myName = "Jugador";
  var myBalance = 1000;
  var socket = io();

  var el = {
    myName: document.getElementById('myName'),
    myChips: document.getElementById('myChips'),
    playersList: document.getElementById('playersList'),
    potAmount: document.getElementById('potAmount'),
    msg: document.getElementById('msg'),
    err: document.getElementById('err'),
    readyBtn: document.getElementById('readyBtn')
  };

  // 1. Primero obtenemos el perfil del usuario mediante la API HTTP existente
  fetch('/api/me', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ initData: initData })
  })
  .then(function(r) { return r.json(); })
  .then(function(data) {
      if(data.error) {
          el.err.textContent = data.error;
          return;
      }
      myName = data.name;
      myBalance = data.balance;
      el.myName.textContent = myName;
      el.myChips.textContent = '$' + myBalance;

      // 2. Una vez autenticado, nos unimos a la sala por WebSockets
      socket.emit('join_multiplayer_table', {
          roomId: 'mesa_principal_1',
          name: myName,
          chips: myBalance
      });
      el.msg.textContent = 'Te has sentado en la mesa.';
  })
  .catch(function(err) {
      console.error("Error al autenticar:", err);
      // Fallback para pruebas locales sin Telegram
      socket.emit('join_multiplayer_table', {
          roomId: 'mesa_principal_1',
          name: 'Invitado Web',
          chips: 1000
      });
  });

  // 3. Escuchar actualizaciones de la mesa en tiempo real
  socket.on('update_multiplayer_table', function(roomState) {
      el.potAmount.textContent = roomState.pot || 0;
      el.playersList.innerHTML = '';

      roomState.players.forEach(function(p) {
          var div = document.createElement('div');
          var isMe = (p.id === socket.id);
          div.className = 'player-seat' + (isMe ? ' me' : '');
          div.innerHTML = '<span><b>' + p.name + '</b>' + (isMe ? ' (Tú)' : '') + '</span><span>$' + p.chips + '</span>';
          el.playersList.appendChild(div);
      });

      if(roomState.players.length < 2) {
          el.msg.textContent = 'Esperando a más jugadores en la mesa...';
      } else {
          el.msg.textContent = 'Mesa lista. ¡Próximamente fase de apuestas!';
      }
  });

  el.readyBtn.addEventListener('click', function() {
      el.msg.textContent = 'Indicador de listo enviado.';
  });
</script>
</body>
</html>
