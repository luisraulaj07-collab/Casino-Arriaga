<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Carreras — Cartel Mexicano</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css">
<style>
.timer{text-align:center;font-weight:700;font-size:14px;margin:4px 0 10px;color:var(--gold)}
.lane{display:flex;align-items:center;gap:8px;background:#141414;border:2px solid var(--line);border-radius:8px;padding:5px 8px;margin-bottom:5px;cursor:pointer}
.lane.sel{border-color:var(--gold);background:#1d1810}
.lane.win{border-color:#7fd88f;background:#12351f}
.badge{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#fff;flex:none;border:2px solid #fff3}
.info{width:92px;flex:none;font-size:11px;line-height:1.25}
.info b{display:block;font-size:12px}
.info span{color:var(--gold);font-weight:700}
.track{position:relative;flex:1;height:30px;border-right:3px dashed #f3ead9aa}
.runner{position:absolute;top:0;display:flex;align-items:center;gap:2px;font-size:22px;will-change:left}
.runner .badge{width:16px;height:16px;font-size:9px}
.hist{display:flex;gap:4px;justify-content:center;margin:8px 0;font-size:10px;color:var(--gold-dim);align-items:center}
.hist .badge{width:18px;height:18px;font-size:10px}
.bets{font-size:11px;color:var(--gold-dim);max-height:90px;overflow-y:auto;margin-top:10px;line-height:1.6}
.bets b{color:var(--cream)}
</style>
</head>
<body>
<div class="table black">
  <div class="brand">CARTEL MEXICANO</div>
  <div class="brand-sub">CARRERAS DE CABALLOS</div>
  <div class="hud">
    <div>Jugador<br><b id="name">—</b></div>
    <div style="text-align:right">Saldo<br><b id="balance">—</b></div>
  </div>

  <div class="timer" id="timer">Conectando…</div>
  <div id="lanes"></div>
  <div class="hist" id="hist"></div>

  <div class="msg" id="msg">Toca un caballo para elegirlo.</div>
  <div class="error" id="err"></div>
  <div class="row">
    <input type="number" id="amt" min="1" placeholder="Monto">
    <button id="betBtn">Apostar</button>
  </div>
  <div class="msg" id="mine" style="font-size:12px;color:var(--gold-dim)"></div>
  <div class="bets" id="bets"></div>

  <a class="lobby-link" href="index.html">← Volver a la mesa principal</a>
</div>

<script>
var tg = window.Telegram.WebApp; tg.ready(); tg.expand();
var initData = tg.initData;
var $ = function(i){ return document.getElementById(i); };
var S = null, offset = 0, sel = -1, builtRound = null;

function api(path, body){
  return fetch(path, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(Object.assign({initData:initData}, body||{}))})
    .then(function(r){ return r.json(); });
}
function money(n){ return '$'+Math.round(n); }
function say(t,c){ $('msg').textContent=t; $('msg').className='msg'+(c?' '+c:''); }
function hname(n){ return S.horses[n-1].name; }
function mkBadge(h){ var b=document.createElement('div'); b.className='badge'; b.style.background=h.color; b.textContent=h.n; return b; }

function buildLanes(){
  var L = $('lanes'); L.innerHTML = '';
  S.horses.forEach(function(h,i){
    var d = document.createElement('div'); d.className='lane'+(i===sel?' sel':''); d.id='ln'+i;
    d.appendChild(mkBadge(h));
    var info = document.createElement('div'); info.className='info';
    var b = document.createElement('b'); b.textContent = h.name;
    var sp = document.createElement('span'); sp.textContent = 'x'+h.odds.toFixed(1);
    info.appendChild(b); info.appendChild(document.createTextNode('paga ')); info.appendChild(sp);
    d.appendChild(info);
    var tr = document.createElement('div'); tr.className='track';
    var rn = document.createElement('div'); rn.className='runner'; rn.id='rn'+i; rn.style.left='0';
    rn.appendChild(mkBadge(h)); rn.appendChild(document.createTextNode('🐎'));
    tr.appendChild(rn); d.appendChild(tr);
    d.addEventListener('click', function(){
      if(!S || S.phase!=='bet') return;
      sel = i;
      document.querySelectorAll('.lane').forEach(function(x,j){ x.classList.toggle('sel', j===i); });
      say('Elegiste a '+h.name+' (x'+h.odds.toFixed(1)+').');
    });
    L.appendChild(d);
  });
}

function render(){
  $('balance').textContent = money(S.balance);
  if(builtRound !== S.roundId){ builtRound = S.roundId; sel = -1; buildLanes(); if(S.phase==='bet') say('Elige tu caballo y apuesta.'); }

  var now = Date.now() + offset;
  var secs = Math.max(0, Math.ceil((S.phaseEnd - now)/1000));
  if(S.phase==='bet') $('timer').textContent = 'Apuestas abiertas: '+secs+'s';
  else if(S.phase==='race') $('timer').textContent = now < S.raceStart ? '¡Arrancan en '+Math.ceil((S.raceStart-now)/1000)+'s!' : '¡Corren!';
  else $('timer').textContent = 'Nueva carrera en '+secs+'s';

  if(S.phase==='race' && now < S.raceStart) say('Apuestas cerradas. ¡Ya casi!');
  if(S.phase==='result' && S.lastResult){
    var w = S.lastResult.winner;
    var ln = $('ln'+(w-1)); if(ln) ln.classList.add('win');
    if(S.myResult && S.myResult.staked>0){
      if(S.myResult.payout>0) say('🏆 Ganó '+hname(w)+'. Cobraste '+money(S.myResult.payout)+'.','win');
      else say('Ganó '+hname(w)+'. Perdiste '+money(S.myResult.staked)+'.','lose');
    } else say('Ganó '+hname(w)+'.');
  }

  $('mine').textContent = S.myBets.length ? 'Tus apuestas: '+S.myBets.map(function(b){ return money(b.amount)+' al #'+b.horse; }).join(' · ') : '';

  var hs = $('hist'); hs.innerHTML = '';
  if(S.history.length){ hs.appendChild(document.createTextNode('Últimos: ')); S.history.forEach(function(n){ hs.appendChild(mkBadge(S.horses[n-1])); }); }

  var bx = $('bets'); bx.innerHTML = '';
  S.bets.forEach(function(b){
    var line = document.createElement('div');
    var nm = document.createElement('b'); nm.textContent = b.name;
    line.appendChild(nm);
    line.appendChild(document.createTextNode(' — '+money(b.amount)+' al #'+b.horse+' ('+hname(b.horse)+')'));
    bx.appendChild(line);
  });
}

function poll(){
  api('/api/carreras/state').then(function(d){
    if(d.error){ $('err').textContent = d.error; return; }
    S = d; offset = d.serverNow - Date.now(); render();
  }).catch(function(){});
}

// Misma fórmula que el servidor da por semillas: todos ven la misma carrera.
function pos(r, t){
  if(t <= 0) return 0;
  var p = Math.min(1, t / r.T);
  if(p < 1) p = Math.max(0, Math.min(0.995, p + 0.045*Math.sin(t/260*r.k + r.ph)*(1-p)));
  return p;
}
function frame(){
  if(S){
    var t = Date.now() + offset - (S.raceStart||0);
    S.horses.forEach(function(h,i){
      var p = (S.runners && S.phase!=='bet') ? pos(S.runners[i], t) : 0;
      var rn = $('rn'+i); if(rn) rn.style.left = 'calc('+(p*100)+'% - '+(p*44)+'px)';
    });
  }
  requestAnimationFrame(frame);
}

$('betBtn').addEventListener('click', function(){
  $('err').textContent = '';
  if(!S || S.phase!=='bet'){ $('err').textContent = 'Las apuestas están cerradas. Espera la siguiente.'; return; }
  if(sel < 0){ $('err').textContent = 'Elige un caballo.'; return; }
  var amount = parseInt($('amt').value, 10);
  if(!amount || amount<=0){ $('err').textContent = 'Ingresa un monto válido.'; return; }
  api('/api/carreras/bet', {horse: sel+1, amount: amount}).then(function(d){
    if(d.error){ $('err').textContent = d.error; return; }
    $('amt').value = '';
    say('Apuesta puesta: '+money(amount)+' a '+hname(sel+1)+'.');
    poll();
  });
});

api('/api/me').then(function(d){ if(!d.error) $('name').textContent = d.name; });
poll(); setInterval(poll, 1000); frame();
</script>
</body>
</html>
