<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Ruleta — Cartel Mexicano</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css">
<style>
  .seg-label{position:absolute;left:50%;top:50%;width:22px;height:22px;margin-left:-11px;margin-top:-114px;transform-origin:11px 114px;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:var(--cream);}
</style>
</head>
<body>
<div class="table black">
  <div class="brand">CARTEL MEXICANO</div>
  <div class="brand-sub">RULETA · 0 AL 36</div>
  <div class="payouts"><span>Color <b>x2</b></span><span>Número <b>x5</b></span><span>El 0 <b>x10</b></span></div>

  <div class="hud">
    <div>Jugador<br><b id="name">—</b></div>
    <div style="text-align:right">Saldo<br><b id="balance">—</b></div>
  </div>

  <div class="wheel-wrap">
    <div class="pointer"></div>
    <div class="wheel-outer"><div class="wheel" id="wheel"></div><div class="hub"></div></div>
  </div>

  <div class="msg" id="msg">Elige tu apuesta y gira.</div>
  <div class="error" id="err"></div>

  <div id="betPanel" class="panel">
    <div class="row">
      <select id="betType">
        <option value="rojo">Rojo (x2)</option>
        <option value="negro">Negro (x2)</option>
        <option value="numero">Número exacto</option>
      </select>
    </div>
    <div class="row" id="numRow" style="display:none">
      <input type="number" id="numInput" min="0" max="36" placeholder="Número (0-36)">
    </div>
    <div class="row">
      <input type="number" id="amountInput" min="1" placeholder="Monto">
      <button id="spinBtn">Girar</button>
    </div>
  </div>

  <div id="nextControls" class="controls" style="display:none">
    <div style="text-align:center;width:100%" id="badgeWrap"></div>
    <button id="nextBtn" style="width:100%">Siguiente giro</button>
  </div>

  <a class="lobby-link" href="index.html">← Volver a la mesa principal</a>
</div>

<script>
  var tg = window.Telegram.WebApp;
  tg.ready(); tg.expand();
  var initData = tg.initData;

  var order = [0,32,15,19,4,21,2,25,17,34,6,27,13,36,11,30,8,23,10,5,24,16,33,1,20,14,31,9,22,18,29,7,28,12,35,3,26];
  var redNumbers = [1,3,5,7,9,12,14,16,18,19,21,23,25,27,30,32,34,36];
  var N = order.length, segAngle = 360/N, currentRotation = 0;

  function colorOf(n){ if(n===0) return 'green'; return redNumbers.indexOf(n)!==-1 ? 'red' : 'black'; }
  function colorHex(c){ return c==='green' ? getComputedStyle(document.documentElement).getPropertyValue('--green') : c==='red' ? getComputedStyle(document.documentElement).getPropertyValue('--red') : getComputedStyle(document.documentElement).getPropertyValue('--black'); }

  var wheelEl = document.getElementById('wheel');
  (function buildWheel(){
    var stops = [];
    for(var i=0;i<N;i++){ var c=colorHex(colorOf(order[i])); stops.push(c+' '+(i*segAngle)+'deg '+((i+1)*segAngle)+'deg'); }
    wheelEl.style.background = 'conic-gradient('+stops.join(',')+')';
    for(var j=0;j<N;j++){
      var lab = document.createElement('div'); lab.className='seg-label'; lab.textContent=order[j];
      lab.style.transform = 'rotate('+(j*segAngle+segAngle/2)+'deg)';
      wheelEl.appendChild(lab);
    }
  })();

  var el = {
    name: document.getElementById('name'), balance: document.getElementById('balance'),
    msg: document.getElementById('msg'), err: document.getElementById('err'),
    betPanel: document.getElementById('betPanel'), betType: document.getElementById('betType'),
    numRow: document.getElementById('numRow'), numInput: document.getElementById('numInput'),
    amountInput: document.getElementById('amountInput'), spinBtn: document.getElementById('spinBtn'),
    nextControls: document.getElementById('nextControls'), nextBtn: document.getElementById('nextBtn'),
    badgeWrap: document.getElementById('badgeWrap')
  };

  el.betType.addEventListener('change', function(){ el.numRow.style.display = this.value==='numero' ? '' : 'none'; });

  function api(path, body){
    return fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(Object.assign({initData:initData}, body||{})) })
      .then(function(r){ return r.json(); });
  }
  function refreshMe(){
    return api('/api/me').then(function(d){
      if(d.error){ el.err.textContent = d.error; return; }
      el.name.textContent = d.name; el.balance.textContent = '$'+d.balance;
    });
  }

  el.spinBtn.addEventListener('click', function(){
    el.err.textContent = '';
    var betType = el.betType.value;
    var number = parseInt(el.numInput.value, 10);
    var amount = parseInt(el.amountInput.value, 10);
    if(betType==='numero' && (isNaN(number)||number<0||number>36)){ el.err.textContent='Escribe un número válido.'; return; }
    if(!amount || amount<=0){ el.err.textContent='Ingresa un monto válido.'; return; }

    el.spinBtn.disabled = true;
    api('/api/roulette/spin', {betType:betType, number:number, amount:amount}).then(function(d){
      el.spinBtn.disabled = false;
      if(d.error){ el.err.textContent = d.error; return; }
      var winIndex = order.indexOf(d.winNumber);
      var targetCenter = winIndex*segAngle + segAngle/2;
      var normalized = ((currentRotation%360)+360)%360;
      var extra = ((360-targetCenter)-normalized+360)%360;
      currentRotation += 5*360 + extra;
      wheelEl.style.transform = 'rotate('+currentRotation+'deg)';

      setTimeout(function(){
        el.balance.textContent = '$'+d.balance;
        var badgeColor = d.color==='red' ? 'var(--red)' : d.color==='black' ? 'var(--black)' : 'var(--green)';
        el.badgeWrap.innerHTML = '<span class="winning-badge" style="background:'+badgeColor+'">'+d.winNumber+'</span>';
        var cls = d.win ? 'win' : 'lose';
        var txt = (d.win ? '¡Ganaste! ' : 'Perdiste. ') + 'Salió ' + d.winNumber + '. (' + (d.delta>=0?'+':'') + '$' + d.delta + ')';
        el.msg.textContent = txt; el.msg.className = 'msg '+cls;
        el.betPanel.style.display = 'none';
        el.nextControls.style.display = '';
      }, 3100);
    });
  });

  el.nextBtn.addEventListener('click', function(){
    el.amountInput.value = ''; el.badgeWrap.innerHTML = '';
    el.msg.textContent = 'Elige tu apuesta y gira.'; el.msg.className = 'msg';
    el.betPanel.style.display = ''; el.nextControls.style.display = 'none';
  });

  refreshMe();
</script>
</body>
</html>
