<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Blackjack — Cartel Mexicano</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="table felt">
  <div class="brand">CARTEL MEXICANO</div>
  <div class="brand-sub">BLACKJACK</div>

  <div class="hud">
    <div>Jugador<br><b id="name">—</b></div>
    <div style="text-align:right">Saldo<br><b id="balance">—</b></div>
  </div>

  <div class="zone">
    <div class="zone-label"><span>Casa</span><span id="dealerTotal"></span></div>
    <div class="hand" id="dealerHand"></div>
  </div>
  <div class="zone">
    <div class="zone-label"><span>Tú</span><span id="playerTotal"></span></div>
    <div class="hand" id="playerHand"></div>
  </div>

  <div class="msg" id="msg">Coloca tu apuesta.</div>
  <div class="error" id="err"></div>

  <div id="betPanel" class="panel">
    <div class="row">
      <input type="number" id="betInput" min="1" placeholder="Apuesta">
      <button id="dealBtn">Repartir</button>
    </div>
  </div>

  <div id="playControls" class="controls" style="display:none">
    <button id="hitBtn">Pedir</button>
    <button id="standBtn">Plantarse</button>
    <button id="doubleBtn" class="secondary">Doblar</button>
  </div>

  <div id="nextControls" class="controls" style="display:none">
    <button id="nextBtn">Siguiente mano</button>
  </div>

  <!-- Enlace con la advertencia y cobro automático al salir -->
  <a class="lobby-link" href="#" onclick="regresarAlLobby(event)">← Volver a la mesa principal</a>
</div>

<script>
  var tg = window.Telegram.WebApp;
  tg.ready(); tg.expand();
  var initData = tg.initData;

  var el = {
    name: document.getElementById('name'), balance: document.getElementById('balance'),
    dealerHand: document.getElementById('dealerHand'), playerHand: document.getElementById('playerHand'),
    dealerTotal: document.getElementById('dealerTotal'), playerTotal: document.getElementById('playerTotal'),
    msg: document.getElementById('msg'), err: document.getElementById('err'),
    betPanel: document.getElementById('betPanel'), betInput: document.getElementById('betInput'),
    dealBtn: document.getElementById('dealBtn'), playControls: document.getElementById('playControls'),
    hitBtn: document.getElementById('hitBtn'), standBtn: document.getElementById('standBtn'),
    doubleBtn: document.getElementById('doubleBtn'), nextControls: document.getElementById('nextControls'),
    nextBtn: document.getElementById('nextBtn')
  };

  function renderCard(c, hidden){
    var d = document.createElement('div');
    if(hidden){ d.className = 'card back'; return d; }
    d.className = 'card' + (c.red ? ' red' : '');
    d.innerHTML = '<div>'+c.rank+c.suit+'</div><div style="align-self:center;font-size:20px">'+c.suit+'</div><div style="align-self:flex-end;transform:rotate(180deg)">'+c.rank+c.suit+'</div>';
    return d;
  }
  function renderState(state, revealed){
    el.dealerHand.innerHTML = '';
    state.dealerHand.forEach(function(c, i){ el.dealerHand.appendChild(renderCard(c, false)); });
    if(!revealed) el.dealerHand.appendChild(renderCard({}, true));
    el.playerHand.innerHTML = '';
    state.playerHand.forEach(function(c){ el.playerHand.appendChild(renderCard(c, false)); });
    el.playerTotal.textContent = state.playerTotal;
    el.dealerTotal.textContent = revealed ? state.dealerTotal : '?';
  }
  function setMsg(t, cls){ el.msg.textContent = t; el.msg.className = 'msg' + (cls?(' '+cls):''); }
  function api(path, body){
    return fetch(path, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(Object.assign({initData:initData}, body||{})) })
      .then(function(r){ return r.json(); });
  }

  function refreshMe(){
    return api('/api/me').then(function(d){
      if(d.error){ el.err.textContent = d.error; return; }
      el.name.textContent = d.name; el.balance.textContent = '$'+d.balance;
    });
  }

  function showPlayPhase(){ el.betPanel.style.display='none'; el.playControls.style.display=''; el.nextControls.style.display='none'; }
  function showEndPhase(){ el.playControls.style.display='none'; el.nextControls.style.display=''; }
  function showBetPhase(){ el.betPanel.style.display=''; el.playControls.style.display='none'; el.nextControls.style.display='none'; el.dealerHand.innerHTML=''; el.playerHand.innerHTML=''; el.playerTotal.textContent=''; el.dealerTotal.textContent=''; }

  // Función de seguridad para notificar al servidor, cobrar y regresar al lobby
  function regresarAlLobby(event) {
    event.preventDefault();
    var juegoActivo = el.playControls.style.display !== 'none';
    
    if (juegoActivo) {
      var confirmar = confirm("⚠️ ¡Atención!\nTienes una mano de Blackjack en curso. Si sales ahora, perderás tu apuesta.");
      if (!confirmar) return;

      api('/api/blackjack/abandon').then(function() {
        window.location.href = 'index.html';
      }).catch(function() {
        window.location.href = 'index.html';
      });
    } else {
      window.location.href = 'index.html';
    }
  }

  function handleResult(d, actionLabel){
    if(d.error){ el.err.textContent = d.error; return; }
    el.err.textContent = '';
    el.balance.textContent = '$' + d.balance;
    if(d.status === 'playing'){
      renderState(d.state, false);
      setMsg('Pide carta, plántate o dobla.');
      showPlayPhase();
    } else {
      renderState(d.state, true);
      var text = d.status === 'win' ? '¡Ganaste!' : d.status === 'lose' ? 'Perdiste.' : d.status === 'blackjack' ? '¡Blackjack!' : 'Empate.';
      var cls = (d.status==='win'||d.status==='blackjack') ? 'win' : (d.status==='lose') ? 'lose' : 'push';
      setMsg(text + ' (' + (d.delta>=0?'+':'') + '$' + d.delta + ')', cls);
      showEndPhase();
    }
  }

  el.dealBtn.addEventListener('click', function(){
    el.err.textContent = '';
    var bet = parseInt(el.betInput.value, 10);
    if(!bet || bet<=0){ el.err.textContent = 'Ingresa una apuesta válida.'; return; }
    api('/api/blackjack/deal', {bet:bet}).then(handleResult);
  });
  el.hitBtn.addEventListener('click', function(){ api('/api/blackjack/hit').then(handleResult); });
  el.standBtn.addEventListener('click', function(){ api('/api/blackjack/stand').then(handleResult); });
  el.doubleBtn.addEventListener('click', function(){ api('/api/blackjack/double').then(handleResult); });
  el.nextBtn.addEventListener('click', function(){ el.betInput.value=''; showBetPhase(); setMsg('Coloca tu apuesta.'); });

  refreshMe();
</script>
</body>
</html>
