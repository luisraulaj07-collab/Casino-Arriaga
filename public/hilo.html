<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Hi-Lo — Cartel Mexicano</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="style.css">
<style>
.hilo-cards{display:flex;justify-content:center;gap:14px;align-items:center;margin:14px 0}
.hcard{width:76px;height:106px;background:var(--cream);border-radius:8px;border:2px solid #cfc2a4;display:flex;flex-direction:column;justify-content:space-between;padding:8px;font-weight:700;font-size:20px;color:var(--ink)}
.hcard.red{color:var(--red)}
.hcard.back{background:repeating-linear-gradient(45deg,var(--gold-dim),var(--gold-dim) 6px,#6b551f 6px,#6b551f 12px);border-color:var(--gold-dim)}
.harrow{font-size:18px;color:var(--gold-dim)}
</style>
</head>
<body>
<div class="table black">
  <div class="brand">CARTEL MEXICANO</div>
  <div class="brand-sub">HI-LO</div>
  <div class="hud">
    <div>Jugador<br><b id="name">—</b></div>
    <div style="text-align:right">Saldo<br><b id="balance">—</b></div>
  </div>

  <div class="hilo-cards">
    <div class="hcard" id="curCard">—</div>
    <div class="harrow">→</div>
    <div class="hcard back" id="nextCard">?</div>
  </div>

  <div class="msg" id="msg">Coloca tu apuesta y empieza.</div>
  <div class="error" id="err"></div>

  <div id="betPanel" class="panel">
    <div class="row"><input type="number" id="betInput" min="1" placeholder="Apuesta"><button id="startBtn">Empezar</button></div>
  </div>

  <div id="guessControls" class="controls" style="display:none">
    <button id="higherBtn">▲ Más alta<br><small id="hGain"></small></button>
    <button id="lowerBtn">▼ Más baja<br><small id="lGain"></small></button>
  </div>
  <div id="cashRow" class="controls" style="display:none">
    <button class="secondary" id="cashBtn">💰 Cobrar <span id="cashGain"></span></button>
  </div>
  <div id="nextControls" class="controls" style="display:none">
    <button id="nextBtn" style="width:100%">Otra ronda</button>
  </div>

  <a class="lobby-link" href="index.html">← Volver a la mesa principal</a>
</div>

<script>
var tg = window.Telegram.WebApp; tg.ready(); tg.expand();
var initData = tg.initData;
var $ = function(i){ return document.getElementById(i); };

function api(path, body){
  return fetch(path, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(Object.assign({initData:initData}, body||{}))})
    .then(function(r){ return r.json(); });
}
function setMsg(t,c){ $('msg').textContent=t; $('msg').className='msg'+(c?' '+c:''); }
function money(n){ return '$'+Math.round(n); }
function renderCard(el, card, hidden){
  if(hidden){ el.className='hcard back'; el.innerHTML='?'; return; }
  el.className='hcard'+((card.suit==='♥'||card.suit==='♦')?' red':'');
  el.innerHTML='<div>'+card.rank+card.suit+'</div><div style="align-self:center;font-size:16px">'+card.suit+'</div><div style="align-self:flex-end;transform:rotate(180deg)">'+card.rank+card.suit+'</div>';
}

function applyView(d){
  $('hGain').textContent = d.higherGain!==null ? '+'+money(d.higherGain) : '—';
  $('lGain').textContent = d.lowerGain!==null ? '+'+money(d.lowerGain) : '—';
  $('higherBtn').disabled = d.higherGain===null;
  $('lowerBtn').disabled = d.lowerGain===null;
  $('cashGain').textContent = d.rounds>0 ? ('+'+money(d.cashoutGain)) : '';
  $('cashRow').style.display = d.rounds>0 ? 'flex' : 'none';
  $('betPanel').style.display='none'; $('guessControls').style.display='flex'; $('nextControls').style.display='none';
}

$('startBtn').addEventListener('click', function(){
  $('err').textContent='';
  var bet = parseInt($('betInput').value,10);
  if(!bet||bet<=0){ $('err').textContent='Ingresa una apuesta válida.'; return; }
  api('/api/hilo/start',{bet:bet}).then(function(d){
    if(d.error){ $('err').textContent=d.error; return; }
    $('balance').textContent = money(d.balance);
    renderCard($('curCard'), d.current, false);
    renderCard($('nextCard'), {}, true);
    setMsg('¿La siguiente es más alta o más baja?');
    applyView(d);
  });
});

function guess(dir){
  $('higherBtn').disabled=true; $('lowerBtn').disabled=true;
  api('/api/hilo/guess',{guess:dir}).then(function(d){
    if(d.error){ $('err').textContent=d.error; $('higherBtn').disabled=false; $('lowerBtn').disabled=false; return; }
    renderCard($('nextCard'), d.nextCard, false);
    if(d.status==='lose'){
      $('balance').textContent = money(d.balance);
      setMsg('Fallaste. Perdiste tu apuesta.','lose');
      $('guessControls').style.display='none'; $('cashRow').style.display='none'; $('nextControls').style.display='flex';
      return;
    }
    if(d.status==='autocash'){
      $('balance').textContent = money(d.balance);
      setMsg('¡Se acabó el mazo! Se cobró automático: +'+money(d.payout),'win');
      $('guessControls').style.display='none'; $('cashRow').style.display='none'; $('nextControls').style.display='flex';
      return;
    }
    setTimeout(function(){
      renderCard($('curCard'), d.current, false);
      renderCard($('nextCard'), {}, true);
      setMsg('¡Acertaste! ¿Cobras o sigues?','win');
      applyView(d);
    }, 700);
  });
}
$('higherBtn').addEventListener('click', function(){ guess('higher'); });
$('lowerBtn').addEventListener('click', function(){ guess('lower'); });

$('cashBtn').addEventListener('click', function(){
  api('/api/hilo/cashout').then(function(d){
    if(d.error){ $('err').textContent=d.error; return; }
    $('balance').textContent = money(d.balance);
    setMsg('¡Cobraste! +'+money(d.payout),'win');
    $('guessControls').style.display='none'; $('cashRow').style.display='none'; $('nextControls').style.display='flex';
  });
});

$('nextBtn').addEventListener('click', function(){
  $('betInput').value='';
  renderCard($('curCard'), {}, true); $('curCard').textContent='—';
  renderCard($('nextCard'), {}, true);
  setMsg('Coloca tu apuesta y empieza.');
  $('betPanel').style.display='block'; $('nextControls').style.display='none';
});

api('/api/me').then(function(d){
  if(d.error){ $('err').textContent=d.error; return; }
  $('name').textContent=d.name; $('balance').textContent=money(d.balance);
  return api('/api/hilo/state');
}).then(function(s){
  if(s && s.active){
    renderCard($('curCard'), s.current, false);
    renderCard($('nextCard'), {}, true);
    setMsg('Ronda en curso. ¿La siguiente es más alta o más baja?');
    applyView(s);
  }
});
</script>
</body>
</html>
